name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm:
        description: Type "yes" to confirm apply or destroy
        required: false
        default: ""

concurrency:
  group: terraform-lambda-auth
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_enable_auth_gateway: ${{ vars.ENABLE_AUTH_GATEWAY || 'true' }}
      TF_VAR_eks_backend_url: ${{ vars.EKS_BACKEND_URL || '' }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_auth_email: ${{ secrets.AUTH_EMAIL }}
      TF_VAR_auth_password: ${{ secrets.AUTH_PASSWORD }}
      TF_VAR_gateway_trust_secret: ${{ secrets.GATEWAY_TRUST_SECRET }}
      TF_VAR_jwt_expires_in: ${{ vars.JWT_EXPIRES_IN || '1h' }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Confirm apply or destroy
        if: (inputs.action == 'apply' || inputs.action == 'destroy') && inputs.confirm != 'yes'
        run: |
          echo "::error::${{ inputs.action }} requires confirm=yes."
          exit 1

      - name: Block production state key
        env:
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          KEY="${TF_STATE_KEY:-split/lambda-auth/terraform.tfstate}"
          if [ "$KEY" = "eks/terraform.tfstate" ]; then
            echo "::error::Refusing to use the monorepo EKS state key. Keep TF_STATE_KEY=split/lambda-auth/terraform.tfstate until cutover."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Write backend.hcl
        env:
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_AWS_REGION: ${{ vars.TF_AWS_REGION }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          if [ -n "$TF_BACKEND_HCL" ]; then
            printf '%s\n' "$TF_BACKEND_HCL" > backend.hcl
          elif [ -n "$TF_STATE_BUCKET" ]; then
            printf '%s\n' \
              "bucket       = \"${TF_STATE_BUCKET}\"" \
              "key          = \"${TF_STATE_KEY:-split/lambda-auth/terraform.tfstate}\"" \
              "region       = \"${TF_AWS_REGION:-us-east-1}\"" \
              "encrypt      = true" \
              "use_lockfile = true" \
              > backend.hcl
          else
            echo "::error::Set TF_STATE_BUCKET / TF_BACKEND_HCL (same S3 bucket as TechChallenge-infra-eks)."
            exit 1
          fi

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Prepare terraform.tfvars
        run: cp terraform.tfvars.example terraform.tfvars

      - name: Validate auth secrets
        run: |
          missing=0
          if [ -z "$TF_VAR_jwt_secret" ]; then echo "::error::JWT_SECRET is required"; missing=1; fi
          if [ -z "$TF_VAR_auth_email" ]; then echo "::error::AUTH_EMAIL is required"; missing=1; fi
          if [ -z "$TF_VAR_auth_password" ]; then echo "::error::AUTH_PASSWORD is required"; missing=1; fi
          if [ -z "$TF_VAR_gateway_trust_secret" ]; then echo "::error::GATEWAY_TRUST_SECRET is required"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Terraform init
        run: terraform init -upgrade -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -no-color

      - name: Terraform apply
        if: inputs.action == 'apply' && inputs.confirm == 'yes'
        run: terraform apply -auto-approve

      - name: Terraform destroy
        if: inputs.action == 'destroy' && inputs.confirm == 'yes'
        run: terraform destroy -auto-approve

      - name: Write job summary
        if: inputs.action == 'apply' && inputs.confirm == 'yes'
        run: |
          {
            echo "## Auth gateway outputs"
            echo ""
            echo "**API Gateway URL:** \`$(terraform output -raw auth_api_gateway_url)\`"
            echo ""
            echo "**EKS backend URL:** \`$(terraform output -raw eks_backend_url)\`"
          } >> "$GITHUB_STEP_SUMMARY"
